<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    
    <!-- 1. Окрашивание статус-бара мобильного устройства -->
    <meta name="theme-color" content="#604539">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- 2. Добавление favicon -->
    <link rel="icon" type="image/x-icon" href="ico/catering-b.ico">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFEED2;
        }

        /* Высота хедера */
        header {
            padding: 8px 16px;
            background-color: #604539;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px; 
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Контейнер для логотипа без круга и рамки */
        .logo-container {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Само изображение логотипа */
        .logo-container img {
            width: 100%; /* Занимает всю ширину контейнера, так как рамки больше нет */
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .logo-placeholder {
            color: #FFEED2;
            font-size: 8px;
            text-align: center;
            font-weight: bold;
        }

        .text-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Шрифт заголовка */
        h1 {
            margin: 0;
            font-size: 14.5px;
            font-weight: 900;
            color: #FFEED2;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.4px;
        }

        /* Шрифт подзаголовка */
        .subtitle {
            margin-top: 1px;
            font-size: 14.5px;
            font-weight: 300;
            color: #FFEED2;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.4px;
        }

        /* Адаптивность для десктопов */
        @media (min-width: 768px) {
            header {
                padding: 8px 32px;
            }
            h1, .subtitle {
                font-size: 17.5px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Логотип" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="logo-placeholder" style="display: none;">LOGO</div>
        </div>

        <div class="text-container">
            <h1>АДМИНСКИЕ МУТКИ</h1>
            <div class="subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <main style="padding: 20px; text-align: center; color: #604539;">
        <p>Добро пожаловать в административную панель.</p>
    </main>

</body>
</html>
