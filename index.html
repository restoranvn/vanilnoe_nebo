<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --brand-color: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
        }

        header {
            padding: 12px 16px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .status-bar {
            height: 48px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            /* Полоска удалена (border-top убран) */
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 100%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: #b5a49d;
        }

        .exit-btn {
            position: absolute;
            right: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            font-weight: 400;
            opacity: 0.9;
            letter-spacing: 0.5px;
            border: 1px solid #FFEED2;
            padding: 4px 10px;
            border-radius: 4px;
            transition: all 0.2s ease;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
        }

        .exit-btn:hover {
            opacity: 1;
            background: rgba(255, 238, 210, 0.15);
        }

        .user-info-badge {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .user-info-badge .type-tag {
            background: #7a5a4d;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #eee;
        }

        .record-indicator {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: none;
            flex-shrink: 0;
        }

        .recording {
            display: block;
            animation: pulse 1s infinite alternate;
        }

        .recorded {
            display: block;
        }

        .record-error {
            display: block;
            background-color: var(--error);
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1.1); }
            to { opacity: 0.4; transform: scale(0.8); }
        }

        main {
            display: none;
            padding: 24px 16px;
            max-width: 500px;
            margin: 0 auto;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            padding: 40px 24px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .welcome-msg {
            font-size: 22px;
            color: var(--brand-color);
            font-weight: 800;
            margin-bottom: 12px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            font-weight: 600;
            font-size: 15px;
            margin-top: 20px;
            padding: 8px 16px;
            background: #f0faf1;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 11px; opacity: 0.9;">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <input type="password" id="tokenInput" class="token-input" placeholder="ВВЕДИТЕ ТОКЕН ДОСТУПА">
    </div>

    <main id="mainApp">
        <div class="card">
            <div class="welcome-msg">Доступ разрешен</div>
            <div style="font-size: 15px; color: #7c6a61; line-height: 1.5;">Ваш вход успешно авторизован.<br>Активность зафиксирована в журнале событий.</div>
            
            <div class="status-indicator" id="syncStatus">
                <span id="syncIcon">✓</span>
                <span id="syncText">Активность записана</span>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "CATER-ILYA": { name: "Илья", type: "Кейтеринг" },
            "CATER-MIXA": { name: "Михаил", type: "Кейтеринг" },
            "CATER-ALEX": { name: "Александр", type: "Кейтеринг" },
            "CATER-SVET": { name: "Светлана", type: "Кейтеринг" },
            "CATER-IRA": { name: "Ирина", type: "Кейтеринг" },
            "BANK-MASHA": { name: "Мария", type: "Банкет" },
            "BANK-RITA": { name: "Маргарита", type: "Банкет" },
            "BANK-KATYA": { name: "Екатерина", type: "Банкет" },
            "BANK-ROMAN": { name: "Роман", type: "Банкет" },
            "BANK-LUBA": { name: "Любовь", type: "Банкет" },
            "SU-ROOT": { name: "Администратор", type: "ROOT" }
        }

        const statusBar = document.getElementById('statusBar');
        const mainApp = document.getElementById('mainApp');

        async function initAuth() {
            try { await signInAnonymously(auth); } catch (e) { console.error(e); }
        }
        initAuth();

        function setupInputListener() {
            const input = document.getElementById('tokenInput');
            if (input) {
                input.addEventListener('input', () => {
                    const val = input.value.trim().toUpperCase();
                    if (USER_DB[val]) {
                        login(USER_DB[val]);
                    }
                });
            }
        }
        setupInputListener();

        function login(user) {
            localStorage.setItem('mutki_user', JSON.stringify(user));
            
            statusBar.innerHTML = `
                <div class="user-info-badge">
                    <div id="recordIndicator" class="record-indicator"></div>
                    <span>${user.name}</span>
                    <span class="type-tag">${user.type}</span>
                </div>
                <div class="exit-btn" onclick="logout()">ВЫХОД</div>
            `;
            
            mainApp.style.display = 'block';
            autoLogActivity(user);
        }

        async function autoLogActivity(user) {
            const currentIndicator = document.getElementById('recordIndicator');
            if (currentIndicator) currentIndicator.className = 'record-indicator recording';

            try {
                if (!auth.currentUser) await signInAnonymously(auth);
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    event: "SESSION_START"
                });
                if (currentIndicator) currentIndicator.className = 'record-indicator recorded';
            } catch (e) {
                console.error(e);
                if (currentIndicator) currentIndicator.className = 'record-indicator record-error';
            }
        }

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        const saved = localStorage.getItem('mutki_user');
        if (saved) {
            login(JSON.parse(saved));
        }
    </script>
</body>
</html>
