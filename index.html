<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --header-bg: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--primary-bg);
            color: #333;
        }

        header {
            padding: 8px 16px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .logo-box {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 36px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .decorative-bar {
            height: 60px; 
            background-color: var(--header-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 16px; 
            border-top: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        /* Обновленный контейнер и стиль заголовка авторизации */
        .auth-label {
            color: white;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .token-input {
            background: transparent; /* Прозрачный фон */
            border: none; /* Без рамок */
            border-bottom: 1px solid rgba(255,255,255,0.3); /* Тонкая линия снизу для ориентира */
            border-radius: 0;
            color: white;
            font-size: 18px;
            font-weight: bold;
            width: 60%; /* Уменьшено на 20% (было 80%) */
            max-width: 240px;
            outline: none;
            text-transform: uppercase;
            padding: 4px 0;
            text-align: center;
            transition: all 0.3s;
        }

        .token-input:focus {
            border-bottom: 1px solid var(--accent);
        }

        /* Убираем плейсхолдер, так как теперь есть текст сверху */
        .token-input::placeholder {
            color: transparent;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #777;
            border: 2px solid white;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            transition: 0.3s;
        }

        .status-dot.active {
            background-color: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        main {
            display: none;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .user-type {
            display: inline-block;
            background: #eee;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        button {
            background: var(--header-bg);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        #logConsole {
            margin-top: 20px;
            background: #1a1a1a;
            color: #00ff41;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border-radius: 8px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.alt='[VN]'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 11px; opacity: 0.8;">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="decorative-bar" id="loginUI">
        <div class="auth-label">Авторизация</div>
        <input type="password" id="tokenInput" class="token-input" autocomplete="off">
        <div id="statusDot" class="status-dot"></div>
    </div>

    <main id="mainApp">
        <div class="card">
            <h2 id="userNameDisplay" style="margin-bottom: 5px;">Привет!</h2>
            <div id="userTypeDisplay" class="user-type">Тип</div>
            
            <div style="border-top: 1px solid #eee; padding-top: 20px; margin-top: 10px;">
                <p style="font-size: 14px; color: #555;">Система готова к записи активности.</p>
                <button id="btnWrite" onclick="logActivity()">
                    <span id="btnText">Записать вход в систему</span>
                </button>
            </div>

            <button onclick="logout()" style="background: #ececec; color: #666; margin-top: 20px; font-size: 13px;">Выйти</button>
        </div>

        <div id="logConsole" style="display: none;"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "CATER-ILYA": { name: "Илья", type: "Кейтеринг" },
            "CATER-MIXA": { name: "Михаил", type: "Кейтеринг" },
            "CATER-ALEX": { name: "Александр", type: "Кейтеринг" },
            "CATER-IRA":  { name: "Ирина", type: "Кейтеринг" },
            "BANK-MASHA": { name: "Мария", type: "Банкет" },
            "BANK-RITA":  { name: "Маргарита", type: "Банкет" },
            "BANK-KATYA": { name: "Екатерина", type: "Банкет" },
            "BANK-ROMAN": { name: "Роман", type: "Банкет" },
            "BANK-LUBA":  { name: "Любовь", type: "Банкет" }
        };

        const input = document.getElementById('tokenInput');
        const dot = document.getElementById('statusDot');

        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth error", e);
            }
        }
        initAuth();

        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (val.length > 0) dot.classList.add('active');
            else dot.classList.remove('active');

            if (USER_DB[val]) {
                login(USER_DB[val]);
            }
        });

        function login(user) {
            localStorage.setItem('mutki_user', JSON.stringify(user));
            document.getElementById('loginUI').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userNameDisplay').innerText = `Привет, ${user.name}!`;
            document.getElementById('userTypeDisplay').innerText = user.type;
        }

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        const saved = localStorage.getItem('mutki_user');
        if (saved) login(JSON.parse(saved));

        window.logActivity = async function() {
            const user = JSON.parse(localStorage.getItem('mutki_user'));
            const btn = document.getElementById('btnWrite');
            const btnText = document.getElementById('btnText');
            
            if (!auth.currentUser) {
                showLog("Ошибка: Нет соединения с сервером.");
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span>Записываю...';
            showLog("Отправка данных в облако...");

            try {
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    device: navigator.userAgent.slice(0, 50)
                });

                showLog("Успешно сохранено в базу данных!");
                btnText.innerText = "Записано ✓";
                btn.style.backgroundColor = "#4CAF50";
                
                setTimeout(() => {
                    btnText.innerText = "Записать еще раз";
                    btn.disabled = false;
                    btn.style.backgroundColor = "";
                }, 3000);

            } catch (e) {
                showLog("Ошибка записи: " + e.message);
                btn.disabled = false;
                btnText.innerText = "Попробовать снова";
            }
        }

        function showLog(msg) {
            const consoleEl = document.getElementById('logConsole');
            consoleEl.style.display = 'block';
            const time = new Date().toLocaleTimeString();
            consoleEl.innerHTML += `<div><span style="color: #888">[${time}]</span> ${msg}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }
    </script>
</body>
</html>
