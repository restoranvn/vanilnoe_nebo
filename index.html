<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --header-bg: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--primary-bg);
            color: #333;
        }

        header {
            padding: 8px 16px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .logo-box {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 36px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .decorative-bar {
            height: 30px;
            background-color: var(--header-bg);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            padding: 0 16px; 
            margin-top: 2px;
            position: relative;
            gap: 10px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #loginBtn {
            cursor: pointer;
            text-decoration: underline;
            transition: opacity 0.2s;
        }

        #loginBtn:hover {
            opacity: 0.8;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 280px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-title {
            margin-top: 0;
            font-size: 20px;
            color: var(--header-bg);
            margin-bottom: 15px;
        }

        .token-input {
            width: 100%;
            box-sizing: border-box;
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            font-size: 20px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.3s;
        }

        .token-input:focus {
            border-color: var(--header-bg);
        }

        main {
            display: none;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .user-info-text {
            color: #fff;
            font-size: 11px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .role-tag {
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }

        button.action-btn {
            background: var(--header-bg);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #logConsole {
            margin-top: 20px;
            background: #1a1a1a;
            color: #00ff41;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border-radius: 8px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.alt='[VN]'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 11px; opacity: 0.8;">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="decorative-bar" id="authBar">
        <div id="loginBtn" onclick="openLoginModal()">ВОЙТИ</div>
        <div id="userInfoDisplay" class="user-info-text" style="display: none;">
            <span id="barUserName"></span>
            <span id="barUserRole" class="role-tag"></span>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal" onclick="closeLoginModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 class="modal-title">Код доступа</h3>
            <input type="password" id="tokenInput" class="token-input" placeholder="••••" autocomplete="off">
        </div>
    </div>

    <main id="mainApp">
        <div class="card">
            <h2 id="welcomeText" style="margin-bottom: 25px;">Система готова</h2>
            
            <div style="border-top: 1px solid #eee; padding-top: 20px;">
                <p style="font-size: 14px; color: #555;">Зафиксировать ваше присутствие в системе:</p>
                <button id="btnWrite" class="action-btn" onclick="logActivity()">
                    <span id="btnText">Записать вход в систему</span>
                </button>
            </div>

            <button onclick="logout()" style="background: #ececec; color: #666; margin-top: 20px; font-size: 13px; border:none; padding:8px; border-radius:6px; cursor:pointer; width:100%;">Выйти из профиля</button>
        </div>

        <div id="logConsole" style="display: none;"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "ILYA-ukSKpqdEwAQ8fRQ": { name: "Илья", type: "Кейтеринг" },
            "MIHAIL-K2izu0N8uPiow": { name: "Михаил", type: "Кейтеринг" },
            "ALEXANDER-fgPIAE68dw": { name: "Александр", type: "Кейтеринг" },
            "IRINA-arSbZ8VVWGqoWA": { name: "Ирина", type: "Кейтеринг" },
            "SVETLANA-RiQmLTG9Rek": { name: "Светлана", type: "Кейтеринг" },
            "MARIYA-yuH0qvTT4mKzn": { name: "Мария", type: "Банкет" },
            "MARGARITA-wdR4Wely0L": { name: "Маргарита", type: "Банкет" },
            "EKATERINA-3xkFrZCMAC": { name: "Екатерина", type: "Банкет" },
            "ROMAN-vZd2krVSe4h4Rz": { name: "Роман", type: "Банкет" },
            "LUBOV-8jNxajISB38CsM": { name: "Любовь", type: "Банкет" },
            "BANKET-CzeZR9BBCdIe0": { name: "Комп в админке", type: "Банкет" },
            "9PpfloMqdqsGMRwReN46": { name: "Суперюзер", type: "SU" }
        };

        const input = document.getElementById('tokenInput');
        const modal = document.getElementById('loginModal');

        async function initAuth() {
            try { await signInAnonymously(auth); } catch (e) {}
        }
        initAuth();

        window.openLoginModal = () => {
            modal.style.display = 'flex';
            input.focus();
        };

        window.closeLoginModal = (e) => {
            if (e.target === modal) modal.style.display = 'none';
        };

        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (USER_DB[val]) {
                login(USER_DB[val]);
                input.value = ""; 
                modal.style.display = 'none'; 
            }
        });

        function login(user) {
            localStorage.setItem('mutki_user', JSON.stringify(user));
            
            document.getElementById('loginBtn').style.display = 'none';
            const display = document.getElementById('userInfoDisplay');
            display.style.display = 'flex';
            document.getElementById('barUserName').innerText = user.name.toUpperCase();
            document.getElementById('barUserRole').innerText = user.type;

            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('welcomeText').innerText = `Привет, ${user.name}!`;
        }

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        const saved = localStorage.getItem('mutki_user');
        if (saved) login(JSON.parse(saved));

        window.logActivity = async function() {
            const user = JSON.parse(localStorage.getItem('mutki_user'));
            const btn = document.getElementById('btnWrite');
            const btnText = document.getElementById('btnText');
            
            if (!auth.currentUser) {
                showLog("Ошибка: Нет соединения.");
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span>Записываю...';

            try {
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    device: navigator.userAgent.slice(0, 50)
                });

                showLog("Успешно записано: " + user.name);
                btnText.innerText = "Записано ✓";
                btn.style.backgroundColor = "#4CAF50";
                
                setTimeout(() => {
                    btnText.innerText = "Записать еще раз";
                    btn.disabled = false;
                    btn.style.backgroundColor = "";
                }, 3000);

            } catch (e) {
                showLog("Ошибка: " + e.message);
                btn.disabled = false;
                btnText.innerText = "Попробовать снова";
            }
        }

        function showLog(msg) {
            const consoleEl = document.getElementById('logConsole');
            consoleEl.style.display = 'block';
            const time = new Date().toLocaleTimeString();
            consoleEl.innerHTML += `<div><span style="color: #888">[${time}]</span> ${msg}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }
    </script>
</body>
</html>
