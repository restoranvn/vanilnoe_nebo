<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --header-bg: #604539;
            --accent: #4CAF50;
            --warning: #FFC107;
            --text-light: #FFFFFF;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
        }

        header {
            padding: 10px 16px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .decorative-bar {
            height: 40px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            border-top: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 80%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: #FFFFFF;
            opacity: 0.7;
        }

        /* Индикатор статуса */
        .status-indicator {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid white;
            background-color: transparent;
            transition: background-color 0.4s ease;
            display: none; /* По умолчанию скрыт */
            margin-left: 10px;
        }

        .status-indicator.loading {
            display: block;
            background-color: var(--warning);
            animation: pulse 1.5s infinite;
        }

        .status-indicator.success {
            display: block;
            background-color: var(--accent);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        main {
            display: none;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .user-type {
            display: inline-block;
            background: #f0f0f0;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            font-weight: 600;
        }

        .welcome-msg {
            font-size: 22px;
            font-weight: bold;
            margin: 0;
            color: #2c1e18;
        }

        .logout-btn {
            background: transparent;
            color: #999;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 40px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .logout-btn:active {
            background: #f5f5f5;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 11px; opacity: 0.8;">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="decorative-bar">
        <input type="password" id="tokenInput" class="token-input" placeholder="АВТОРИЗАЦИЯ">
        <div id="statusIndicator" class="status-indicator"></div>
    </div>

    <main id="mainApp">
        <div class="card">
            <p class="welcome-msg" id="userNameDisplay">Привет!</p>
            <div id="userTypeDisplay" class="user-type">Пользователь</div>
            
            <div style="margin-top: 30px; color: #888; font-size: 14px;">
                <p>Вход зафиксирован автоматически.</p>
                <div style="color: var(--accent); font-weight: bold;">Сессия активна ✓</div>
            </div>

            <button class="logout-btn" onclick="logout()">Выйти из профиля</button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "", // Оставляем пустым для среды исполнения
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        // Инициализация Firebase
        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "CATER-ILYA": { name: "Илья", type: "Кейтеринг" },
            "CATER-MIXA": { name: "Михаил", type: "Кейтеринг" },
            "CATER-ALEX": { name: "Александр", type: "Кейтеринг" },
            "BANK-LUBA": { name: "Светлана", type: "Кейтеринг" },
            "CATER-IRA": { name: "Ирина", type: "Кейтеринг" },
            "BANK-MASHA": { name: "Мария", type: "Банкет" },
            "BANK-RITA": { name: "Маргарита", type: "Банкет" },
            "BANK-KATYA": { name: "Екатерина", type: "Банкет" },
            "BANK-ROMAN": { name: "Роман", type: "Банкет" },
            "BANK-LUBOV": { name: "Любовь", type: "Банкет" },
            "SU-ADMIN": { name: "Администратор", type: "SU" }
        };

        const input = document.getElementById('tokenInput');
        const indicator = document.getElementById('statusIndicator');

        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (e) { console.error("Auth error", e); }
        }
        initAuth();

        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (USER_DB[val]) {
                handleSuccessfulLogin(USER_DB[val]);
            }
        });

        async function handleSuccessfulLogin(user) {
            // Сохраняем в память
            localStorage.setItem('mutki_user', JSON.stringify(user));
            
            // UI переход
            input.style.display = 'none';
            indicator.className = 'status-indicator loading';
            
            // Отображаем интерфейс
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userNameDisplay').innerText = `Привет, ${user.name}!`;
            document.getElementById('userTypeDisplay').innerText = user.type;

            // Автоматическая запись
            await logActivityToCloud(user);
        }

        async function logActivityToCloud(user) {
            if (!auth.currentUser) return;

            try {
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    action: "AUTO_LOGIN",
                    timestamp: serverTimestamp(),
                    device: navigator.userAgent.slice(0, 80)
                });

                // Успех -> Зеленый
                indicator.className = 'status-indicator success';
            } catch (e) {
                console.error("Cloud log error", e);
                // В случае ошибки оставляем индикатор желтым или гасим через время
                setTimeout(() => indicator.style.display = 'none', 3000);
            }
        }

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        // Проверка сессии при загрузке
        const saved = localStorage.getItem('mutki_user');
        if (saved) {
            const user = JSON.parse(saved);
            input.style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userNameDisplay').innerText = `С возвращением, ${user.name}!`;
            document.getElementById('userTypeDisplay').innerText = user.type;
            indicator.className = 'status-indicator success';
        }
    </script>
</body>
</html>
