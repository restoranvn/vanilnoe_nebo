<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --brand-color: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
            --logout-bg: #1F1713;
            --logout-text: #FFEED2;
            --dark-ui: #1F1713;
            --border-sep: #78866B; 
            --day-bg: #f5f5f5;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 12px 16px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .header-subtitle {
            font-size: 11px; 
            opacity: 0.9;
        }

        .status-bar {
            height: 52px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 100%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: #b5a49d;
        }

        .user-info-badge {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .logout-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--logout-bg);
            border: 1px solid var(--logout-text);
            color: var(--logout-text);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls-area {
            display: none;
            padding: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        .buttons-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            width: 50px;
            height: 50px;
            background-color: var(--dark-ui);
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--logout-text);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: flex-start;
            backdrop-filter: blur(2px);
            padding: 0 12px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            border: 1px solid var(--dark-ui);
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            padding: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: relative;
            margin-top: 100px;
            margin-bottom: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: var(--dark-ui);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--dark-ui);
            padding: 0;
            line-height: 1;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--brand-color);
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 0 2px rgba(96, 69, 57, 0.1);
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            color: var(--dark-ui);
        }

        .day-name {
            font-size: 11px;
            font-weight: 800;
            padding: 8px 0;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .day {
            padding: 12px 0;
            font-size: 14px;
            background-color: var(--day-bg);
            border-radius: 6px;
            cursor: pointer;
        }

        .today {
            border: 1.5px solid var(--dark-ui);
            background-color: #fff;
            font-weight: 900;
        }

        .record-indicator {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: none;
        }

        .recording { display: block; animation: pulse 1s infinite alternate; }
        .recorded { display: block; }
        .record-error { display: block; background-color: var(--error); }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1.1); }
            to { opacity: 0.4; transform: scale(0.8); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div class="header-subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <input type="password" id="tokenInput" class="token-input" placeholder="ВВЕДИТЕ ТОКЕН ДОСТУПА">
    </div>

    <div class="controls-area" id="controlsArea">
        <div class="buttons-grid">
            <button class="action-btn" id="openCalendar" title="Открыть календарь">
                <svg viewBox="0 0 24 24">
                    <path d="M19,4H18V2H16V4H8V2H6V4H5C3.89,4 3,4.9 3,6V20A2,2 0 0,0 5,22H19A2,2 0 0,0 21,20V6A2,2 0 0,0 19,4M19,20H5V10H19V20M19,8H5V6H19V8Z" />
                </svg>
            </button>
            <button class="action-btn" id="addEntryBtn" title="Добавить запись">
                <svg viewBox="0 0 24 24">
                    <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Модалка Календаря -->
    <div class="modal-overlay" id="calendarModal">
        <div class="modal-content" id="swipeArea" style="touch-action: none;">
            <div class="modal-header">
                <div class="calendar-nav">
                    <button class="close-modal" id="prevMonth" style="font-size: 20px;">❮</button>
                    <span id="currentDateTitle" class="modal-title">--.--</span>
                    <button class="close-modal" id="nextMonth" style="font-size: 20px;">❯</button>
                </div>
                <button class="close-modal" id="closeCalendar">&times;</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- Модалка Кейтеринга -->
    <div class="modal-overlay" id="cateringModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="cateringModalTitle">Кейтеринг</span>
                <button class="close-modal" onclick="closeAllModals()">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">Дата мероприятия</label>
                <input type="text" class="form-input date-mask" placeholder="ДД.ММ.ГГГГ" inputmode="numeric">
            </div>
            <div class="form-group">
                <label class="form-label">Название мероприятия</label>
                <input type="text" class="form-input" id="cateringNameInput" placeholder="Введите название">
            </div>
            <div class="form-placeholder">Дополнительные детали кейтеринга будут доступны позже...</div>
        </div>
    </div>

    <!-- Модалка Банкета -->
    <div class="modal-overlay" id="banketModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="banketModalTitle">Банкет</span>
                <button class="close-modal" onclick="closeAllModals()">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">Дата мероприятия</label>
                <input type="text" class="form-input date-mask" placeholder="ДД.ММ.ГГГГ" inputmode="numeric">
            </div>
            <div class="form-group">
                <label class="form-label">Заказчик</label>
                <input type="text" class="form-input" id="banketCustomerInput" placeholder="ФИО или Организация">
            </div>
            <div class="form-placeholder">Дополнительные детали банкета будут доступны позже...</div>
        </div>
    </div>

    <!-- Модалка для ROOT -->
    <div class="modal-overlay" id="rootModal">
        <div class="modal-content" style="text-align: center;">
            <div class="modal-header">
                <span class="modal-title">Ограничение</span>
                <button class="close-modal" onclick="closeAllModals()">&times;</button>
            </div>
            <div style="font-size: 24px; font-weight: 900; padding: 40px 0; color: var(--dark-ui);">
                Оно тебе зачем?
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "ILYA-SKCTGRFWBMXMKQY": { name: "Илья", type: "Кейтеринг" },
            "MIHAIL-RRZELPUUDKKWH": { name: "Михаил", type: "Кейтеринг" },
            "ALEKSANDR-ZNLOECNPWC": { name: "Александр", type: "Кейтеринг" },
            "SVETLANA-BCPYOFHTQLH": { name: "Светлана", type: "Кейтеринг" },
            "IRINA-XZVQVVEDNLHPQL": { name: "Ирина", type: "Кейтеринг" },
            "MARIYA-OBEJMOVRJOWLM": { name: "Мария", type: "Банкет" },
            "MARGARITA-OEZIJCSZOB": { name: "Маргарита", type: "Банкет" },
            "EKATERINA-OIPVVDUULA": { name: "Екатерина", type: "Банкет" },
            "ROMAN-XINGOXQCHUREVX": { name: "Роман", type: "Банкет" },
            "LUBOV-LYSYQXWOBLVOEZ": { name: "Любовь", type: "Банкет" },
            "SU-JPQDNIRXDCARMAVTH": { name: "SU Илья", type: "ROOT" }
        }

        const input = document.getElementById('tokenInput');
        const statusBar = document.getElementById('statusBar');
        const controlsArea = document.getElementById('controlsArea');
        const calGrid = document.getElementById('calendarGrid');
        const dateTitle = document.getElementById('currentDateTitle');
        const swipeArea = document.getElementById('swipeArea');

        let currentUser = null;
        let displayedMonth = new Date().getMonth();
        let displayedYear = new Date().getFullYear();

        async function initAuth() {
            try { await signInAnonymously(auth); } catch (e) { console.error(e); }
        }
        initAuth();

        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (USER_DB[val]) login(USER_DB[val]);
        });

        function login(user) {
            currentUser = user;
            localStorage.setItem('mutki_user', JSON.stringify(user));
            statusBar.innerHTML = `
                <div class="user-info-badge">
                    <div id="recordIndicator" class="record-indicator"></div>
                    <span>${user.name}</span>
                </div>
                <button class="logout-btn" onclick="logout()">Выход</button>
            `;
            controlsArea.style.display = 'block';
            autoLogActivity(user);
        }

        async function autoLogActivity(user) {
            const currentIndicator = document.getElementById('recordIndicator');
            if (currentIndicator) currentIndicator.className = 'record-indicator recording';
            try {
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    event: "SESSION_START"
                });
                if (currentIndicator) currentIndicator.className = 'record-indicator recorded';
            } catch (e) {
                if (currentIndicator) currentIndicator.className = 'record-indicator record-error';
            }
        }

        // МАСКА ДАТЫ (ДД.ММ.ГГГГ)
        document.querySelectorAll('.date-mask').forEach(input => {
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, ''); // Удаляем всё кроме цифр
                if (value.length > 8) value = value.slice(0, 8); // Ограничение длины
                
                let formattedValue = '';
                if (value.length > 0) {
                    formattedValue = value.slice(0, 2);
                    if (value.length > 2) {
                        formattedValue += '.' + value.slice(2, 4);
                        if (value.length > 4) {
                            formattedValue += '.' + value.slice(4, 8);
                        }
                    }
                }
                e.target.value = formattedValue;
            });
        });

        function buildCalendar(m, y) {
            const realNow = new Date();
            const realToday = realNow.getDate();
            const realMonth = realNow.getMonth();
            const realYear = realNow.getFullYear();
            const monthsGenitive = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
            const monthsNominative = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

            const isCurrentMonth = (m === realMonth && y === realYear);
            dateTitle.innerText = isCurrentMonth ? `${realToday} ${monthsGenitive[m]}` : `${monthsNominative[m]} ${y !== realYear ? y : ''}`;

            calGrid.innerHTML = '';
            ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(d => {
                const el = document.createElement('div');
                el.className = 'day-name'; el.innerText = d; calGrid.appendChild(el);
            });

            const firstDay = new Date(y, m, 1).getDay();
            const offset = firstDay === 0 ? 6 : firstDay - 1;
            for (let i = 0; i < offset; i++) calGrid.appendChild(document.createElement('div'));

            const daysInMonth = new Date(y, m + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const el = document.createElement('div');
                el.className = 'day';
                if (isCurrentMonth && d === realToday) el.classList.add('today');
                el.innerText = d;
                calGrid.appendChild(el);
            }
        }

        document.getElementById('prevMonth').onclick = () => { displayedMonth--; if(displayedMonth<0){displayedMonth=11;displayedYear--} buildCalendar(displayedMonth, displayedYear); };
        document.getElementById('nextMonth').onclick = () => { displayedMonth++; if(displayedMonth>11){displayedMonth=0;displayedYear++} buildCalendar(displayedMonth, displayedYear); };

        let tsX = 0;
        swipeArea.addEventListener('touchstart', e => tsX = e.changedTouches[0].screenX, {passive:true});
        swipeArea.addEventListener('touchend', e => {
            const teX = e.changedTouches[0].screenX;
            if (tsX - teX > 50) document.getElementById('nextMonth').click();
            if (teX - tsX > 50) document.getElementById('prevMonth').click();
        }, {passive:true});

        document.getElementById('openCalendar').onclick = () => {
            displayedMonth = new Date().getMonth();
            displayedYear = new Date().getFullYear();
            buildCalendar(displayedMonth, displayedYear);
            document.getElementById('calendarModal').style.display = 'flex';
        };

        // ЛОГИКА КНОПКИ ПЛЮС
        document.getElementById('addEntryBtn').onclick = () => {
            if (!currentUser) return;
            
            if (currentUser.type === "ROOT") {
                document.getElementById('rootModal').style.display = 'flex';
                return;
            }

            const newTitle = "Новое мероприятие";
            
            if (currentUser.type === "Кейтеринг") {
                document.getElementById('cateringModalTitle').innerText = newTitle;
                document.getElementById('cateringModal').style.display = 'flex';
            } else if (currentUser.type === "Банкет") {
                document.getElementById('banketModalTitle').innerText = newTitle;
                document.getElementById('banketModal').style.display = 'flex';
            }
        };

        window.closeAllModals = function() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            // Очистка полей при закрытии
            document.querySelectorAll('.form-input').forEach(i => i.value = '');
            document.getElementById('cateringModalTitle').innerText = "Кейтеринг";
            document.getElementById('banketModalTitle').innerText = "Банкет";
        };

        document.getElementById('closeCalendar').onclick = closeAllModals;
        
        window.onclick = (e) => {
            if (e.target.classList.contains('modal-overlay')) closeAllModals();
        };

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        const saved = localStorage.getItem('mutki_user');
        if (saved) login(JSON.parse(saved));
    </script>
</body>
</html>
