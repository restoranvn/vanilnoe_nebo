<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    
    <!-- 1. Окрашивание статус-бара мобильного устройства -->
    <!-- Для Android Chrome и современных браузеров -->
    <meta name="theme-color" content="#604539">
    <!-- Для iOS Safari -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- 2. Добавление favicon -->
    <link rel="icon" type="image/x-icon" href="ico/catering-b.ico">

    <style>
        /* Общие стили для страницы */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFEED2; /* Основной фон страницы */
        }

        /* Стили хедера */
        header {
            padding: 10px 20px;
            background-color: #604539; /* Цвет фона хедера */
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 70px;
            box-sizing: border-box;
            /* Плавный переход для iOS при прокрутке */
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Контейнер для логотипа (круг остается прежнего размера) */
        .logo-container-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #FFEED2;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: transparent;
            flex-shrink: 0;
        }

        /* Само изображение (уменьшено на 20%) */
        .logo-container-circle img {
            width: 80%; /* Уменьшение на 20% */
            height: 80%;
            object-fit: contain;
            display: block;
        }

        /* Заглушка для логотипа */
        .logo-placeholder {
            color: #FFEED2;
            font-size: 10px;
            text-align: center;
            font-weight: bold;
        }

        /* Контейнер для текста справа */
        .text-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Заголовок "АДМИНСКИЕ МУТКИ" */
        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 900;
            color: #FFEED2;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        /* Подзаголовок "ВАНИЛЬНОГО НЕБА" */
        .subtitle {
            margin-top: 1px;
            font-size: 18px;
            font-weight: 300;
            color: #FFEED2;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        /* Адаптивность для десктопов */
        @media (min-width: 768px) {
            header {
                padding: 10px 40px;
            }
            h1, .subtitle {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container-circle">
            <!-- Путь к логотипу. Изображение отцентрировано и уменьшено внутри круга -->
            <img src="ico/catering-b.ico" alt="Логотип" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="logo-placeholder" style="display: none;">LOGO</div>
        </div>

        <div class="text-container">
            <h1>АДМИНСКИЕ МУТКИ</h1>
            <div class="subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <main style="padding: 20px; text-align: center; color: #604539;">
        <p>Добро пожаловать в административную панель.</p>
    </main>

</body>
</html>
