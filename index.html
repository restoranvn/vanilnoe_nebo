<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --header-bg: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
        }

        header {
            padding: 12px 16px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        /* Информационная панель / Панель ввода */
        .status-bar {
            height: 40px;
            background-color: #533b31;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.3s ease;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.1);
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 80%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .user-info-badge {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .user-info-badge .type-tag {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
        }

        main {
            display: none;
            padding: 24px 16px;
            max-width: 500px;
            margin: 0 auto;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .action-button {
            background: var(--header-bg);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
            transition: transform 0.1s, background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .action-button:disabled {
            background: #a08e86;
            cursor: not-allowed;
        }

        .logout-link {
            display: inline-block;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
            text-decoration: none;
            border-bottom: 1px dashed #ccc;
            cursor: pointer;
        }

        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Скрытая консоль для отладки, если понадобится в будущем */
        #hiddenLog { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 11px; opacity: 0.8;">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <!-- Содержимое меняется динамически через JS -->
        <input type="password" id="tokenInput" class="token-input" placeholder="ВВЕДИТЕ ТОКЕН ДОСТУПА">
    </div>

    <main id="mainApp">
        <div class="card">
            <div style="margin-bottom: 25px;">
                <div style="font-size: 18px; color: #604539; font-weight: 600;">Система готова к работе</div>
                <div style="font-size: 14px; color: #888; margin-top: 5px;">Нажмите кнопку ниже для фиксации события</div>
            </div>
            
            <button id="btnWrite" class="action-button" onclick="logActivity()">
                <span id="btnIcon"></span>
                <span id="btnText">Записать вход в систему</span>
            </button>

            <div class="logout-link" onclick="logout()">Сменить пользователя</div>
        </div>
    </main>

    <div id="hiddenLog"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // Fallback config
        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "CATER-ILYA": { name: "Илья", type: "Кейтеринг" },
            "CATER-MIXA": { name: "Михаил", type: "Кейтеринг" },
            "CATER-ALEX": { name: "Александр", type: "Кейтеринг" },
            "CATER-IRA": { name: "Ирина", type: "Кейтеринг" },
            "BANK-MASHA": { name: "Мария", type: "Банкет" },
            "BANK-RITA": { name: "Маргарита", type: "Банкет" },
            "BANK-KATYA": { name: "Екатерина", type: "Банкет" },
            "BANK-ROMAN": { name: "Роман", type: "Банкет" },
            "BANK-LUBA": { name: "Любовь", type: "Банкет" },
            "SU-ROOT": { name: "Суперюзер", type: "Админ" }
        }

        const input = document.getElementById('tokenInput');
        const statusBar = document.getElementById('statusBar');
        const mainApp = document.getElementById('mainApp');

        // Инициализация анонимной авторизации Firebase
        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth failed", e);
            }
        }
        initAuth();

        // Обработка ввода токена
        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (USER_DB[val]) {
                login(USER_DB[val]);
            }
        });

        function login(user) {
            localStorage.setItem('mutki_user', JSON.stringify(user));
            
            // Обновляем статус-бар вместо удаления
            statusBar.innerHTML = `
                <div class="user-info-badge">
                    <span>${user.name}</span>
                    <span class="type-tag">${user.type}</span>
                </div>
            `;
            statusBar.style.backgroundColor = '#4a352c'; // Немного другой оттенок для индикации входа
            
            mainApp.style.display = 'block';
        }

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        // Проверка сессии при загрузке
        const saved = localStorage.getItem('mutki_user');
        if (saved) {
            login(JSON.parse(saved));
        }

        window.logActivity = async function() {
            const userString = localStorage.getItem('mutki_user');
            if (!userString) return;
            const user = JSON.parse(userString);
            
            const btn = document.getElementById('btnWrite');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            
            if (!auth.currentUser) {
                console.error("No auth");
                return;
            }

            // UI State: Loading
            btn.disabled = true;
            btnIcon.innerHTML = '<div class="loading-spinner"></div>';
            btnText.innerText = "Записываю...";

            try {
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    userAgent: navigator.userAgent
                });

                // UI State: Success
                btnIcon.innerHTML = '✓';
                btnText.innerText = "Успешно записано";
                btn.style.backgroundColor = "#4CAF50";
                
                setTimeout(() => {
                    btnText.innerText = "Записать еще раз";
                    btnIcon.innerHTML = '';
                    btn.disabled = false;
                    btn.style.backgroundColor = "";
                }, 3000);

            } catch (e) {
                console.error("Write error", e);
                btn.disabled = false;
                btnIcon.innerHTML = '✕';
                btnText.innerText = "Ошибка. Повторить?";
                btn.style.backgroundColor = "#ff4444";
            }
        }
    </script>
</body>
</html>
