<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --brand-color: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
            --logout-bg: #1F1713;
            --logout-text: #FFEED2;
            --dark-ui: #1F1713;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 12px 16px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .header-subtitle {
            font-size: 11px; 
            opacity: 0.9;
        }

        .status-bar {
            height: 52px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 100%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: #b5a49d;
        }

        .user-info-badge {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .logout-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--logout-bg);
            border: 1px solid var(--logout-text);
            color: var(--logout-text);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Контейнер для кнопок управления */
        .controls-area {
            display: none; /* Показывается после входа */
            padding: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        .cal-btn {
            width: 50px;
            height: 50px;
            background-color: var(--dark-ui);
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .cal-btn:active {
            transform: scale(0.95);
        }

        .cal-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--logout-text);
        }

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: white;
            border: 1px solid var(--dark-ui);
            width: 90%;
            max-width: 320px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            animation: slideUp 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: var(--dark-ui);
            font-weight: bold;
            font-size: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--dark-ui);
            padding: 0;
            line-height: 1;
        }

        /* Календарная сетка */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            color: var(--dark-ui);
        }

        .day-name {
            font-size: 11px;
            font-weight: 800;
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .day {
            padding: 10px 0;
            font-size: 15px;
            border: 1px solid transparent;
        }

        .today {
            border: 1px solid var(--dark-ui);
            font-weight: bold;
        }

        .record-indicator {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: none;
        }

        .recording { display: block; animation: pulse 1s infinite alternate; }
        .recorded { display: block; }
        .record-error { display: block; background-color: var(--error); }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1.1); }
            to { opacity: 0.4; transform: scale(0.8); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div class="header-subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <input type="password" id="tokenInput" class="token-input" placeholder="ВВЕДИТЕ ТОКЕН ДОСТУПА">
    </div>

    <div class="controls-area" id="controlsArea">
        <button class="cal-btn" id="openCalendar" title="Открыть календарь">
            <svg viewBox="0 0 24 24">
                <path d="M19,4H18V2H16V4H8V2H6V4H5C3.89,4 3,4.9 3,6V20A2,2 0 0,0 5,22H19A2,2 0 0,0 21,20V6A2,2 0 0,0 19,4M19,20H5V10H19V20M19,8H5V6H19V8Z" />
            </svg>
        </button>
    </div>

    <!-- Модалка Календаря -->
    <div class="modal-overlay" id="calendarModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="currentDateTitle">--.--</span>
                <button class="close-modal" id="closeCalendar">&times;</button>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- JS Fill -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "ILYA-SKCTGRFWBMXMKQY": { name: "Илья", type: "Кейтеринг" },
            "MIHAIL-RRZELPUUDKKWH": { name: "Михаил", type: "Кейтеринг" },
            "ALEKSANDR-ZNLOECNPWC": { name: "Александр", type: "Кейтеринг" },
            "SVETLANA-BCPYOFHTQLH": { name: "Светлана", type: "Кейтеринг" },
            "IRINA-XZVQVVEDNLHPQL": { name: "Ирина", type: "Кейтеринг" },
            "MARIYA-OBEJMOVRJOWLM": { name: "Мария", type: "Банкет" },
            "MARGARITA-OEZIJCSZOB": { name: "Маргарита", type: "Банкет" },
            "EKATERINA-OIPVVDUULA": { name: "Екатерина", type: "Банкет" },
            "ROMAN-XINGOXQCHUREVX": { name: "Роман", type: "Банкет" },
            "LUBOV-LYSYQXWOBLVOEZ": { name: "Любовь", type: "Банкет" },
            "SU-JPQDNIRXDCARMAVTH": { name: "SU Илья", type: "ROOT" }
        }

        const input = document.getElementById('tokenInput');
        const statusBar = document.getElementById('statusBar');
        const controlsArea = document.getElementById('controlsArea');
        const modal = document.getElementById('calendarModal');
        const calGrid = document.getElementById('calendarGrid');
        const dateTitle = document.getElementById('currentDateTitle');

        async function initAuth() {
            try { await signInAnonymously(auth); } catch (e) { console.error(e); }
        }
        initAuth();

        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (USER_DB[val]) {
                login(USER_DB[val]);
            }
        });

        function login(user) {
            localStorage.setItem('mutki_user', JSON.stringify(user));
            
            statusBar.innerHTML = `
                <div class="user-info-badge">
                    <div id="recordIndicator" class="record-indicator"></div>
                    <span>${user.name}</span>
                </div>
                <button class="logout-btn" onclick="logout()">Выход</button>
            `;
            
            controlsArea.style.display = 'block';
            autoLogActivity(user);
        }

        async function autoLogActivity(user) {
            const currentIndicator = document.getElementById('recordIndicator');
            if (currentIndicator) currentIndicator.className = 'record-indicator recording';

            try {
                if (!auth.currentUser) await signInAnonymously(auth);
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    event: "SESSION_START"
                });
                if (currentIndicator) currentIndicator.className = 'record-indicator recorded';
            } catch (e) {
                console.error(e);
                if (currentIndicator) currentIndicator.className = 'record-indicator record-error';
            }
        }

        // Логика Календаря
        function buildCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();

            // Формат заголовок: дд.мм
            dateTitle.innerText = `${String(today).padStart(2, '0')}.${String(month + 1).padStart(2, '0')}`;

            calGrid.innerHTML = '';
            const daysShort = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            daysShort.forEach(d => {
                const el = document.createElement('div');
                el.className = 'day-name';
                el.innerText = d;
                calGrid.appendChild(el);
            });

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const offset = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1; 
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < offset; i++) {
                calGrid.appendChild(document.createElement('div'));
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const el = document.createElement('div');
                el.className = 'day';
                if (d === today) el.classList.add('today');
                el.innerText = d;
                calGrid.appendChild(el);
            }
        }

        document.getElementById('openCalendar').addEventListener('click', () => {
            buildCalendar();
            modal.style.display = 'flex';
        });

        document.getElementById('closeCalendar').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.onclick = (event) => {
            if (event.target == modal) modal.style.display = 'none';
        }

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        const saved = localStorage.getItem('mutki_user');
        if (saved) login(JSON.parse(saved));
    </script>
</body>
</html>
