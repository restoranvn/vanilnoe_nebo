<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --brand-color: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
            --dialog-border: #1F1713;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
        }

        header {
            padding: 12px 16px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: relative;
            z-index: 10;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .status-bar {
            height: 48px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            padding: 0 10px;
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 100%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: #b5a49d;
        }

        .nav-btn {
            cursor: pointer;
            font-size: 11px;
            font-weight: 400;
            opacity: 0.9;
            letter-spacing: 0.5px;
            border: 1px solid #FFEED2;
            padding: 4px 10px;
            border-radius: 4px;
            transition: all 0.2s ease;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-btn:hover {
            opacity: 1;
            background: rgba(255, 238, 210, 0.15);
        }

        .settings-btn { position: absolute; left: 12px; }
        .exit-btn { position: absolute; right: 12px; }

        .user-info-badge {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .user-info-badge .type-tag {
            background: #7a5a4d;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #eee;
        }

        .record-indicator {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: none;
        }

        .recording { display: block; animation: pulse 1s infinite alternate; }
        .recorded { display: block; }
        .record-error { display: block; background-color: var(--error); }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1.1); }
            to { opacity: 0.4; transform: scale(0.8); }
        }

        main {
            display: none;
            padding: 24px 16px;
            max-width: 500px;
            margin: 0 auto;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            padding: 40px 24px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Modal Styles */
        #modalOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border: 1px solid var(--dialog-border);
            padding: 24px;
            width: 100%;
            max-width: 320px;
            border-radius: 4px;
            position: relative;
        }

        .modal-header h2 { margin: 0; font-size: 18px; color: var(--brand-color); }
        .modal-header p { margin: 4px 0 20px; font-size: 12px; color: #888; text-transform: uppercase; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        
        .styled-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .save-btn {
            background: var(--brand-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 20px;
            color: #999;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 11px; opacity: 0.9;">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <input type="password" id="tokenInput" class="token-input" placeholder="ВВЕДИТЕ ТОКЕН ДОСТУПА">
    </div>

    <main id="mainApp">
        <div class="card">
            <div class="welcome-msg">Доступ разрешен</div>
            <div style="font-size: 15px; color: #7c6a61; line-height: 1.5;">Ваш вход успешно авторизован.<br>Активность зафиксирована в журнале событий.</div>
            <div id="saveStatus" style="font-size: 12px; margin-top: 10px; color: var(--accent);"></div>
        </div>
    </main>

    <!-- Modal for Settings -->
    <div id="modalOverlay">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleModal(false)">&times;</span>
            <div class="modal-header">
                <h2 id="modalUserName">Имя пользователя</h2>
                <p id="modalUserType">Тип</p>
            </div>
            <div class="form-group">
                <label>НОМЕР ТЕЛЕФОНА</label>
                <input type="tel" id="phoneInput" class="styled-input" placeholder="+7 (___) ___-__-__">
            </div>
            <button class="save-btn" onclick="saveProfile()">СОХРАНИТЬ</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "CATER-ILYA": { name: "Илья", type: "Кейтеринг" },
            "CATER-MIXA": { name: "Михаил", type: "Кейтеринг" },
            "CATER-ALEX": { name: "Александр", type: "Кейтеринг" },
            "CATER-SVET": { name: "Светлана", type: "Кейтеринг" },
            "CATER-IRA": { name: "Ирина", type: "Кейтеринг" },
            "BANK-MASHA": { name: "Мария", type: "Банкет" },
            "BANK-RITA": { name: "Маргарита", type: "Банкет" },
            "BANK-KATYA": { name: "Екатерина", type: "Банкет" },
            "BANK-ROMAN": { name: "Роман", type: "Банкет" },
            "BANK-LUBA": { name: "Любовь", type: "Банкет" },
            "SU-ROOT": { name: "Администратор", type: "ROOT" }
        }

        const statusBar = document.getElementById('statusBar');
        const mainApp = document.getElementById('mainApp');
        const phoneInput = document.getElementById('phoneInput');

        // Auth init
        async function initAuth() {
            try { 
                await signInAnonymously(auth); 
            } catch (e) { 
                console.error("Auth error:", e); 
            }
        }
        initAuth();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const saved = localStorage.getItem('mutki_user');
                if (saved) {
                    const userData = JSON.parse(saved);
                    login(userData);
                    loadProfile(user.uid);
                }
            }
        });

        // Input Logic
        function setupInputListener() {
            const input = document.getElementById('tokenInput');
            if (input) {
                input.addEventListener('input', () => {
                    const val = input.value.trim().toUpperCase();
                    if (USER_DB[val]) {
                        login(USER_DB[val]);
                    }
                });
            }
        }
        setupInputListener();

        // Phone Formatting Logic
        phoneInput.addEventListener('input', (e) => {
            let value = e.target.value;
            if (value.startsWith('8')) {
                value = '+7' + value.substring(1);
            } else if (value.startsWith('9')) {
                value = '+7' + value;
            }
            e.target.value = value;
        });

        function login(user) {
            localStorage.setItem('mutki_user', JSON.stringify(user));
            
            statusBar.innerHTML = `
                <div class="nav-btn settings-btn" onclick="toggleModal(true)">НАСТРОЙКИ</div>
                <div class="user-info-badge">
                    <div id="recordIndicator" class="record-indicator"></div>
                    <span>${user.name}</span>
                    <span class="type-tag">${user.type}</span>
                </div>
                <div class="nav-btn exit-btn" onclick="logout()">ВЫХОД</div>
            `;
            
            document.getElementById('modalUserName').innerText = user.name;
            document.getElementById('modalUserType').innerText = user.type;
            
            mainApp.style.display = 'block';
            autoLogActivity(user);
        }

        async function loadProfile(uid) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', uid, 'profile');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    phoneInput.value = docSnap.data().phone || "";
                }
            } catch (e) { console.error("Error loading profile:", e); }
        }

        window.toggleModal = function(show) {
            document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none';
        }

        window.saveProfile = async function() {
            const user = auth.currentUser;
            const userData = JSON.parse(localStorage.getItem('mutki_user'));
            if (!user || !userData) return;

            const phone = phoneInput.value.trim();
            const statusEl = document.getElementById('saveStatus');

            try {
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile');
                await setDoc(docRef, {
                    name: userData.name,
                    type: userData.type,
                    phone: phone,
                    updatedAt: serverTimestamp()
                });
                
                statusEl.innerText = "Данные профиля обновлены";
                toggleModal(false);
                setTimeout(() => statusEl.innerText = "", 3000);
            } catch (e) {
                console.error("Save error:", e);
                statusEl.innerText = "Ошибка сохранения";
                statusEl.style.color = "red";
            }
        }

        async function autoLogActivity(user) {
            const currentIndicator = document.getElementById('recordIndicator');
            if (currentIndicator) currentIndicator.className = 'record-indicator recording';

            try {
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    event: "SESSION_START"
                });
                if (currentIndicator) currentIndicator.className = 'record-indicator recorded';
            } catch (e) {
                console.error(e);
                if (currentIndicator) currentIndicator.className = 'record-indicator record-error';
            }
        }

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }
    </script>
</body>
</html>
