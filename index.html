<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --header-bg: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
            --modal-overlay: rgba(0, 0, 0, 0.6);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
        }

        header {
            padding: 8px 16px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .logo-box { display: flex; align-items: center; }
        .logo-img { height: 36px; width: auto; object-fit: contain; }

        .decorative-bar {
            height: 50px; 
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px; 
            border-top: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .token-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            width: 80%;
            max-width: 300px;
            outline: none;
            text-transform: uppercase;
            padding: 8px;
            text-align: center;
            transition: all 0.3s;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #777;
            border: 2px solid white;
            position: absolute;
            right: 20px;
            transition: 0.3s;
        }

        .status-dot.active {
            background-color: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        main {
            display: none;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .user-type {
            display: inline-block;
            background: #eee;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        button {
            background: var(--header-bg);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Стили Модального Окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            backdrop-filter: blur(4px);
            display: none; /* Скрыто по умолчанию */
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            animation: modalSlideUp 0.3s ease-out;
        }

        @keyframes modalSlideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title { font-weight: bold; font-size: 18px; margin-bottom: 12px; }
        .modal-text { font-size: 15px; color: #555; margin-bottom: 20px; line-height: 1.4; }

        #logConsole {
            margin-top: 20px;
            background: #1a1a1a;
            color: #00ff41;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            border-radius: 8px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div id="logoFallback" style="font-weight: bold; margin-left: 5px; display: none;">[VN]</div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 10px; opacity: 0.8; text-transform: uppercase;">Ванильного Неба</div>
        </div>
    </header>

    <div class="decorative-bar" id="loginUI">
        <input type="password" id="tokenInput" class="token-input" placeholder="КОД ДОСТУПА" autocomplete="off">
        <div id="statusDot" class="status-dot"></div>
    </div>

    <main id="mainApp">
        <div class="card">
            <h2 id="userNameDisplay" style="margin: 0 0 5px 0;">Привет!</h2>
            <div id="userTypeDisplay" class="user-type">Тип</div>
            
            <div style="border-top: 1px solid #eee; padding-top: 20px; margin-top: 10px;">
                <p style="font-size: 14px; color: #555; margin-bottom: 20px;">Нажмите кнопку ниже для фиксации активности в системе.</p>
                <button id="btnWrite">
                    <span id="btnText">Записать вход</span>
                </button>
            </div>

            <button onclick="logout()" style="background: transparent; color: #999; margin-top: 20px; font-size: 12px; font-weight: normal; border: 1px solid #ddd;">Выйти из профиля</button>
        </div>

        <div id="logConsole" style="display: none;"></div>
    </main>

    <!-- Модальное окно -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Уведомление</div>
            <div class="modal-text" id="modalText">Сообщение системы.</div>
            <button onclick="closeModal()" style="background: var(--header-bg); width: auto; min-width: 120px;">Понятно</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // Config
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-admin-mutki';

        const USER_DB = {
            "CATER-ILYA": { name: "Илья", type: "Кейтеринг" },
            "CATER-MIXA": { name: "Михаил", type: "Кейтеринг" },
            "CATER-IRA":  { name: "Ирина", type: "Кейтеринг" },
            "BANK-MASHA": { name: "Мария", type: "Банкет" },
            "BANK-RITA":  { name: "Маргарита", type: "Банкет" },
            "BANK-KATYA": { name: "Екатерина", type: "Банкет" }
        };

        let currentUser = null;

        // UI Elements
        const input = document.getElementById('tokenInput');
        const dot = document.getElementById('statusDot');
        const modal = document.getElementById('modalOverlay');
        const btnWrite = document.getElementById('btnWrite');

        // Modal Logic
        window.showModal = (title, text) => {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            modal.style.display = 'flex';
        };

        window.closeModal = () => {
            modal.style.display = 'none';
        };

        // Auth Init
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                signInAnonymously(auth).catch(err => console.error("Auth fail", err));
            }
        });

        // Login Logic
        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (val.length > 0) dot.classList.add('active');
            else dot.classList.remove('active');

            if (USER_DB[val]) {
                const user = USER_DB[val];
                localStorage.setItem('mutki_user', JSON.stringify(user));
                renderApp(user);
            }
        });

        function renderApp(user) {
            currentUser = user;
            document.getElementById('loginUI').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userNameDisplay').innerText = `Привет, ${user.name}!`;
            document.getElementById('userTypeDisplay').innerText = user.type;
        }

        window.logout = () => {
            localStorage.removeItem('mutki_user');
            location.reload();
        };

        // Action Logic
        btnWrite.onclick = async () => {
            if (!currentUser || !auth.currentUser) {
                showModal("Ошибка", "Система не авторизована. Проверьте интернет.");
                return;
            }

            const btnText = document.getElementById('btnText');
            btnWrite.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span>Сохраняю...';

            try {
                // Путь согласно правилам: /artifacts/{appId}/public/data/{collection}
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'activity_logs');
                
                await addDoc(logRef, {
                    uid: auth.currentUser.uid,
                    userName: currentUser.name,
                    userType: currentUser.type,
                    timestamp: serverTimestamp(),
                    action: "System Login"
                });

                showLog(`Активность записана для ${currentUser.name}`);
                showModal("Успешно", "Ваш вход успешно зафиксирован в облачной базе данных.");
                
                btnText.innerText = "Записано ✓";
                btnWrite.style.backgroundColor = "#4CAF50";

                setTimeout(() => {
                    btnText.innerText = "Записать еще раз";
                    btnWrite.disabled = false;
                    btnWrite.style.backgroundColor = "";
                }, 3000);

            } catch (e) {
                console.error(e);
                showModal("Ошибка БД", "Не удалось отправить данные: " + e.message);
                btnWrite.disabled = false;
                btnText.innerText = "Попробовать снова";
            }
        };

        function showLog(msg) {
            const consoleEl = document.getElementById('logConsole');
            consoleEl.style.display = 'block';
            const time = new Date().toLocaleTimeString();
            consoleEl.innerHTML += `<div><span style="color: #666">[${time}]</span> ${msg}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        // Auto-login if session exists
        const saved = localStorage.getItem('mutki_user');
        if (saved) renderApp(JSON.parse(saved));

    </script>
</body>
</html>
