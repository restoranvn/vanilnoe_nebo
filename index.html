<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --header-bg: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
        }

        header {
            padding: 12px 16px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        /* Информационная панель / Панель ввода */
        .status-bar {
            height: 48px;
            background-color: #533b31;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.1);
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 100%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .user-info-badge {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .user-info-badge .type-tag {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
            vertical-align: middle;
        }

        /* Мигающий индикатор записи */
        .record-indicator {
            position: absolute;
            right: 16px;
            width: 10px;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: none;
        }

        .recording {
            display: block;
            animation: pulse 1s infinite alternate;
            box-shadow: 0 0 8px #4CAF50;
        }

        .recorded {
            display: block;
            animation: none;
            opacity: 0.8;
            box-shadow: none;
        }

        .record-error {
            display: block;
            background-color: var(--error);
            animation: none;
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.3; transform: scale(0.8); }
        }

        main {
            display: none;
            padding: 24px 16px;
            max-width: 500px;
            margin: 0 auto;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            padding: 40px 20px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .welcome-msg {
            font-size: 20px;
            color: #604539;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            font-weight: 600;
            font-size: 15px;
            margin-top: 15px;
        }

        .logout-link {
            display: inline-block;
            margin-top: 40px;
            color: #b5a49d;
            font-size: 13px;
            text-decoration: none;
            border-bottom: 1px dashed #d1c5bf;
            cursor: pointer;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: var(--header-bg);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 11px; opacity: 0.8;">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <input type="password" id="tokenInput" class="token-input" placeholder="ВВЕДИТЕ ТОКЕН ДОСТУПА">
        <div id="recordIndicator" class="record-indicator"></div>
    </div>

    <main id="mainApp">
        <div class="card">
            <div class="welcome-msg">Добро пожаловать!</div>
            <div style="font-size: 15px; color: #888;">Ваш вход успешно авторизован и зафиксирован в системе.</div>
            
            <div class="status-indicator" id="syncStatus">
                <span id="syncIcon">✓</span>
                <span id="syncText">Активность записана</span>
            </div>

            <div class="logout-link" onclick="logout()">Сменить пользователя / Выйти</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "CATER-ILYA": { name: "Илья", type: "Кейтеринг" },
            "CATER-MIXA": { name: "Михаил", type: "Кейтеринг" },
            "CATER-ALEX": { name: "Александр", type: "Кейтеринг" },
            "CATER-IRA": { name: "Ирина", type: "Кейтеринг" },
            "BANK-MASHA": { name: "Мария", type: "Банкет" },
            "BANK-RITA": { name: "Маргарита", type: "Банкет" },
            "BANK-KATYA": { name: "Екатерина", type: "Банкет" },
            "BANK-ROMAN": { name: "Роман", type: "Банкет" },
            "BANK-LUBA": { name: "Любовь", type: "Банкет" },
            "SU-ROOT": { name: "Суперюзер", type: "Админ" }
        }

        const input = document.getElementById('tokenInput');
        const statusBar = document.getElementById('statusBar');
        const mainApp = document.getElementById('mainApp');
        const indicator = document.getElementById('recordIndicator');

        async function initAuth() {
            try { await signInAnonymously(auth); } catch (e) { console.error(e); }
        }
        initAuth();

        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (USER_DB[val]) {
                login(USER_DB[val]);
            }
        });

        function login(user) {
            localStorage.setItem('mutki_user', JSON.stringify(user));
            
            // Очищаем и центрируем имя
            statusBar.innerHTML = `
                <div class="user-info-badge">
                    <span>${user.name}</span>
                    <span class="type-tag">${user.type}</span>
                </div>
                <div id="recordIndicator" class="record-indicator"></div>
            `;
            statusBar.style.backgroundColor = '#4a352c';
            
            mainApp.style.display = 'block';

            autoLogActivity(user);
        }

        async function autoLogActivity(user) {
            const currentIndicator = document.getElementById('recordIndicator');
            const syncIcon = document.getElementById('syncIcon');
            const syncText = document.getElementById('syncText');
            
            if (currentIndicator) {
                currentIndicator.className = 'record-indicator recording';
            }

            try {
                if (!auth.currentUser) await signInAnonymously(auth);

                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    event: "AUTO_LOGIN"
                });

                // Останавливаем мигание при успехе
                if (currentIndicator) {
                    currentIndicator.className = 'record-indicator recorded';
                }

                syncIcon.innerText = "✓";
                syncText.innerText = "Активность записана";

            } catch (e) {
                console.error(e);
                if (currentIndicator) {
                    currentIndicator.className = 'record-indicator record-error';
                }
                syncIcon.innerText = "✕";
                syncText.innerText = "Ошибка синхронизации";
                syncText.parentElement.style.color = "#ff4444";
            }
        }

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        const saved = localStorage.getItem('mutki_user');
        if (saved) {
            login(JSON.parse(saved));
        }
    </script>
</body>
</html>
