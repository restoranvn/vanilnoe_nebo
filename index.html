<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --header-bg: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--primary-bg);
        }

        header {
            padding: 10px 16px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }

        .decorative-bar {
            height: 40px; 
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px; 
            border-top: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .token-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: white;
            font-size: 14px;
            font-weight: 900;
            width: 200px;
            outline: none;
            text-transform: uppercase;
            padding: 4px;
            text-align: center;
        }

        .status-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: #777;
            border: 2px solid white;
            position: absolute;
            right: 10px;
            transition: 0.3s;
        }

        .status-dot.active {
            background-color: var(--accent);
        }

        main {
            display: none;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background: var(--header-bg);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        #logConsole {
            margin-top: 20px;
            background: #222;
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            border-radius: 6px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold;">[VN]</div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 12px; font-weight: 300;">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="decorative-bar" id="loginUI">
        <input type="password" id="tokenInput" class="token-input" placeholder="КОД ДОСТУПА">
        <div id="statusDot" class="status-dot"></div>
    </div>

    <main id="mainApp">
        <div class="card">
            <h2 id="userNameDisplay">Привет!</h2>
            <div id="userTypeDisplay" style="font-style: italic; color: #666; margin-bottom: 15px;">Тип</div>
            
            <div style="border-top: 1px solid #eee; padding-top: 15px;">
                <p>Тестовая функция: запись времени входа в файл log.txt</p>
                <button onclick="testWrite()">Записать в GitHub</button>
            </div>

            <button onclick="logout()" style="background: #999; margin-top: 30px;">Выйти</button>
        </div>

        <div id="logConsole"></div>
    </main>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        const GITHUB_CONFIG = {
            pat: "ghp_ВАШ_ТОКЕН_ЗДЕСЬ", // ВСТАВЬТЕ СЮДА ВАШ ТОКЕН
            owner: "ВАШ_ЛОГИН_GITHUB",   // ВАШ ЛОГИН
            repo: "НАЗВАНИЕ_РЕПО"        // НАЗВАНИЕ ВАШЕГО ПРИВАТНОГО РЕПО
        };

        const USER_DB = {
            "CATER-ILYA": { name: "Илья", type: "Кейтеринг" },
            "CATER-MIXA": { name: "Михаил", type: "Кейтеринг" },
            "CATER-ALEX": { name: "Александр", type: "Кейтеринг" },
            "CATER-IRA":  { name: "Ирина", type: "Кейтеринг" },
            "BANK-MASHA": { name: "Мария", type: "Банкет" },
            "BANK-RITA":  { name: "Маргарита", type: "Банкет" },
            "BANK-KATYA": { name: "Екатерина", type: "Банкет" },
            "BANK-ROMAN": { name: "Роман", type: "Банкет" },
            "BANK-LUBA":  { name: "Любовь", type: "Банкет" }
        };

        const input = document.getElementById('tokenInput');
        const dot = document.getElementById('statusDot');

        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (val.length > 0) dot.classList.add('active');
            else dot.classList.remove('active');

            if (USER_DB[val]) {
                login(USER_DB[val]);
            }
        });

        function login(user) {
            localStorage.setItem('mutki_user', JSON.stringify(user));
            document.getElementById('loginUI').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userNameDisplay').innerText = `Привет, ${user.name}!`;
            document.getElementById('userTypeDisplay').innerText = `Доступ: ${user.type}`;
        }

        function logout() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        // Проверка при загрузке
        const saved = localStorage.getItem('mutki_user');
        if (saved) login(JSON.parse(saved));

        // --- ЛОГИКА ВЗАИМОДЕЙСТВИЯ С GITHUB ---

        async function testWrite() {
            const user = JSON.parse(localStorage.getItem('mutki_user'));
            const content = `Пользователь ${user.name} (${user.type}) вошел в систему: ${new Date().toLocaleString()}\n`;
            
            showLog("Подключение к GitHub...");
            
            try {
                const filename = "activity_log.txt";
                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${filename}`;
                
                // 1. Пытаемся получить файл, чтобы взять его SHA
                let sha = "";
                const getRes = await fetch(url, {
                    headers: { "Authorization": `token ${GITHUB_CONFIG.pat}` }
                });

                let existingContent = "";
                if (getRes.status === 200) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                    existingContent = decodeURIComponent(escape(atob(fileData.content)));
                }

                // 2. Формируем новый контент (старый + новый заголовок)
                const newFullContent = existingContent + content;

                // 3. Отправляем обновление
                const putRes = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_CONFIG.pat}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Log update by ${user.name}`,
                        content: btoa(unescape(encodeURIComponent(newFullContent))),
                        sha: sha || undefined
                    })
                });

                if (putRes.ok) {
                    showLog("Успешно записано в репозиторий!");
                } else {
                    const err = await putRes.json();
                    showLog("Ошибка: " + err.message);
                }

            } catch (e) {
                showLog("Критическая ошибка: " + e.message);
            }
        }

        function showLog(msg) {
            const consoleEl = document.getElementById('logConsole');
            consoleEl.style.display = 'block';
            consoleEl.innerHTML += `> ${msg}<br>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }
    </script>
</body>
</html>
