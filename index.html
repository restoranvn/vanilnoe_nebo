<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    
    <meta name="theme-color" content="#604539">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" type="image/x-icon" href="ico/catering-b.ico">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFEED2;
        }

        header {
            padding: 8px 16px;
            background-color: #604539;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px; 
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Область авторизации */
        .auth-bar {
            height: 34px; 
            background-color: #604539;
            margin-top: 2px; /* Отступ в 2px от шапки */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-sizing: border-box;
        }

        /* Индикатор */
        .status-indicator {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid #FFFFFF;
            box-sizing: border-box;
            background-color: transparent;
            /* Смещение влево: 5px от края экрана */
            /* Учитываем padding родителя (16px), поэтому используем отрицательный margin или перебиваем его */
            margin-left: -11px; 
        }

        .auth-bar span {
            color: #FFEED2;
            font-size: 11px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .logo-container {
            width: 29.33px;
            height: 29.33px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .logo-placeholder {
            color: #FFEED2;
            font-size: 6px;
            text-align: center;
            font-weight: bold;
        }

        .text-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin: 0;
            font-size: 14.5px;
            font-weight: 900;
            color: #FFFFFF;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.4px;
        }

        .subtitle {
            margin-top: 1px;
            font-size: 14.5px;
            font-weight: 300;
            color: #FFFFFF;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.4px;
        }

        @media (min-width: 768px) {
            header, .auth-bar {
                padding-left: 32px;
                padding-right: 32px;
            }
            /* Корректировка отступа для десктопа, чтобы оставалось 5px от края */
            .status-indicator {
                margin-left: -27px;
            }
            h1, .subtitle {
                font-size: 17.5px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Логотип" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="logo-placeholder" style="display: none;">LOGO</div>
        </div>

        <div class="text-container">
            <h1>АДМИНСКИЕ МУТКИ</h1>
            <div class="subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="auth-bar">
        <div class="status-indicator"></div>
        <span>Авторизация</span>
    </div>

    <main style="padding: 20px; text-align: center; color: #604539;">
        <p>Добро пожаловать в административную панель.</p>
    </main>

</body>
</html>
