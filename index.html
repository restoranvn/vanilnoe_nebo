<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --brand-color: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
            --dialog-border: #1F1713;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
        }

        header {
            padding: 12px 16px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: relative;
            z-index: 10;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .status-bar {
            height: 48px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            padding: 0 10px;
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 100%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: #b5a49d;
        }

        .nav-btn {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: white;
            text-decoration: none;
            box-sizing: border-box;
        }

        .settings-btn { 
            position: absolute; 
            left: 12px; 
            width: 32px;
            height: 23px; 
            border: 1px solid #FFEED2;
            border-radius: 4px;
        }
        
        .exit-btn { 
            position: absolute; 
            right: 12px;
            font-size: 11px;
            font-weight: 400;
            opacity: 0.9;
            letter-spacing: 0.5px;
            border: 1px solid #FFEED2;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .nav-btn:hover {
            opacity: 1;
            background: rgba(255, 238, 210, 0.15);
        }

        .user-info-badge {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .user-info-badge .type-tag {
            background: #7a5a4d;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #eee;
        }

        .record-indicator {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: none;
        }

        .recording { display: block; animation: pulse 1s infinite alternate; }
        .recorded { display: block; }
        .record-error { display: block; background-color: var(--error); }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1.1); }
            to { opacity: 0.4; transform: scale(0.8); }
        }

        main {
            display: none;
            padding: 24px 16px;
            max-width: 500px;
            margin: 0 auto;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            padding: 40px 24px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Modal Styles */
        #modalOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border: 1px solid var(--dialog-border);
            padding: 24px;
            width: 100%;
            max-width: 320px;
            border-radius: 4px;
            position: relative;
        }

        .modal-header h2 { margin: 0; font-size: 18px; color: var(--brand-color); }
        .modal-header p { margin: 4px 0 20px; font-size: 12px; color: #888; text-transform: uppercase; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        
        .styled-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .save-btn {
            background: var(--brand-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .save-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 20px;
            color: #999;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div style="font-size: 11px; opacity: 0.9;">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <input type="password" id="tokenInput" class="token-input" placeholder="ВВЕДИТЕ ТОКЕН ДОСТУПА">
    </div>

    <main id="mainApp">
        <div class="card">
            <div class="welcome-msg">Доступ разрешен</div>
            <div style="font-size: 15px; color: #7c6a61; line-height: 1.5;">Ваш вход успешно авторизован.<br>Активность зафиксирована в журнале событий.</div>
            <div id="saveStatus" style="font-size: 12px; margin-top: 15px; font-weight: bold;"></div>
        </div>
    </main>

    <div id="modalOverlay">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleModal(false)">&times;</span>
            <div class="modal-header">
                <h2 id="modalUserName">Имя пользователя</h2>
                <p id="modalUserType">Тип</p>
            </div>
            <div class="form-group">
                <label>НОМЕР ТЕЛЕФОНА</label>
                <input type="tel" id="phoneInput" class="styled-input" placeholder="+7 (999) 000-00-00">
            </div>
            <button class="save-btn" id="btnSaveProfile" onclick="saveProfile()">СОХРАНИТЬ</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "CATER-ILYA": { name: "Илья", type: "Кейтеринг" },
            "CATER-MIXA": { name: "Михаил", type: "Кейтеринг" },
            "CATER-ALEX": { name: "Александр", type: "Кейтеринг" },
            "CATER-SVET": { name: "Светлана", type: "Кейтеринг" },
            "CATER-IRA": { name: "Ирина", type: "Кейтеринг" },
            "BANK-MASHA": { name: "Мария", type: "Банкет" },
            "BANK-RITA": { name: "Маргарита", type: "Банкет" },
            "BANK-KATYA": { name: "Екатерина", type: "Банкет" },
            "BANK-ROMAN": { name: "Роман", type: "Банкет" },
            "BANK-LUBA": { name: "Любовь", type: "Банкет" },
            "SU-ROOT": { name: "Администратор", type: "ROOT" }
        };

        let currentUserAuth = null;

        // AUTH INITIALIZATION (MANDATORY RULE 3)
        async function initAuth() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            currentUserAuth = user;
            if (user) {
                const savedUser = localStorage.getItem('mutki_user');
                if (savedUser) {
                    const userData = JSON.parse(savedUser);
                    renderLoggedInState(userData);
                    loadProfileData(user.uid);
                }
            }
        });

        // Application Logic
        const statusBar = document.getElementById('statusBar');
        const mainApp = document.getElementById('mainApp');
        const phoneInput = document.getElementById('phoneInput');

        document.getElementById('tokenInput').addEventListener('input', (e) => {
            const val = e.target.value.trim().toUpperCase();
            if (USER_DB[val]) {
                localStorage.setItem('mutki_user', JSON.stringify(USER_DB[val]));
                initAuth(); // Trigger auth on login
            }
        });

        phoneInput.addEventListener('input', (e) => {
            let val = e.target.value;
            if (val.startsWith('8')) val = '+7' + val.substring(1);
            else if (val.startsWith('9')) val = '+7' + val;
            e.target.value = val;
        });

        function renderLoggedInState(user) {
            statusBar.innerHTML = `
                <div class="nav-btn settings-btn" onclick="toggleModal(true)" title="Профиль">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="user-info-badge">
                    <div id="recordIndicator" class="record-indicator"></div>
                    <span>${user.name}</span>
                    <span class="type-tag">${user.type}</span>
                </div>
                <div class="nav-btn exit-btn" onclick="logout()">ВЫХОД</div>
            `;
            
            document.getElementById('modalUserName').innerText = user.name;
            document.getElementById('modalUserType').innerText = user.type;
            mainApp.style.display = 'block';
            autoLogActivity(user);
        }

        async function loadProfileData(uid) {
            if (!uid) return;
            try {
                // RULE 1: Private path
                const docRef = doc(db, 'artifacts', appId, 'users', uid, 'profile');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    phoneInput.value = docSnap.data().phone || "";
                }
            } catch (e) {
                console.error("Error loading profile:", e);
            }
        }

        window.toggleModal = (show) => {
            document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none';
        };

        window.saveProfile = async function() {
            if (!currentUserAuth) {
                showStatus("Ошибка авторизации. Перезайдите.", "red");
                return;
            }

            const btn = document.getElementById('btnSaveProfile');
            const phone = phoneInput.value.trim();
            const userData = JSON.parse(localStorage.getItem('mutki_user'));

            btn.disabled = true;
            btn.innerText = "СОХРАНЕНИЕ...";

            try {
                // RULE 1: Strict private path
                const docRef = doc(db, 'artifacts', appId, 'users', currentUserAuth.uid, 'profile');
                await setDoc(docRef, {
                    name: userData.name,
                    type: userData.type,
                    phone: phone,
                    updatedAt: serverTimestamp()
                });
                
                showStatus("Профиль сохранен успешно", "var(--accent)");
                toggleModal(false);
            } catch (e) {
                console.error("Save error:", e);
                showStatus("Ошибка доступа к БД", "red");
            } finally {
                btn.disabled = false;
                btn.innerText = "СОХРАНИТЬ";
            }
        };

        function showStatus(text, color) {
            const el = document.getElementById('saveStatus');
            el.innerText = text;
            el.style.color = color;
            setTimeout(() => el.innerText = "", 4000);
        }

        async function autoLogActivity(user) {
            const indicator = document.getElementById('recordIndicator');
            if (indicator) indicator.className = 'record-indicator recording';

            try {
                // RULE 1: Public data path
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    event: "SESSION_START"
                });
                if (indicator) indicator.className = 'record-indicator recorded';
            } catch (e) {
                console.error(e);
                if (indicator) indicator.className = 'record-indicator record-error';
            }
        }

        window.logout = () => {
            localStorage.removeItem('mutki_user');
            location.reload();
        };

        // Check initial state
        const saved = localStorage.getItem('mutki_user');
        if (saved) initAuth();

    </script>
</body>
</html>
