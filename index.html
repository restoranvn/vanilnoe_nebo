<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    
    <meta name="theme-color" content="#604539">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFEED2;
        }

        header {
            padding: 8px 16px;
            background-color: #604539;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px; 
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .decorative-bar {
            height: 34px; 
            background-color: #604539;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            box-sizing: border-box;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #4CAF50;
            border: 2px solid #FFFFFF;
        }

        .logo-container {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-placeholder {
            color: #FFEED2;
            font-size: 8px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #FFEED2;
            padding: 2px;
        }

        .text-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin: 0;
            font-size: 14.5px;
            font-weight: 900;
            color: #FFFFFF;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.4px;
        }

        .subtitle {
            margin-top: 1px;
            font-size: 14.5px;
            font-weight: 300;
            color: #FFFFFF;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.4px;
        }

        main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .welcome-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .welcome-card h2 {
            color: #604539;
            margin-top: 0;
        }

        .action-buttons {
            margin-top: 20px;
            display: grid;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            background: #604539;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn:active {
            background: #4a352c;
        }

        @media (min-width: 768px) {
            h1, .subtitle { font-size: 17.5px; }
            .action-buttons {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-placeholder">VN</div>
        </div>

        <div class="text-container">
            <h1>АДМИНСКИЕ МУТКИ</h1>
            <div class="subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="decorative-bar">
        <div class="status-dot"></div>
    </div>

    <main>
        <div class="welcome-card">
            <h2>Привет, Илья!</h2>
            <p>Добро пожаловать в панель управления кейтерингом. Все системы работают в штатном режиме.</p>
            
            <div class="action-buttons">
                <button class="btn">Управление заказами</button>
                <button class="btn">Редактировать меню</button>
                <button class="btn">Статистика</button>
                <button class="btn">Настройки</button>
            </div>
        </div>
    </main>

</body>
</html>
