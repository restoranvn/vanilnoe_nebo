<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <style>
        /* Общие стили для страницы */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFEED2; /* Основной фон страницы */
        }

        /* Стили хедера с уменьшенной высотой */
        header {
            padding: 15px 20px; /* Отступы уменьшены в два раза (с 30px до 15px) */
            text-align: center;
            background-color: #1F1713; /* Цвет области хедера */
        }

        /* Заголовок "АДМИНСКИЕ МУТКИ" */
        h1 {
            margin: 0;
            font-size: 20px; /* Размер шрифта сохранен */
            font-weight: 900;
            color: #FFEED2; /* Цвет текста */
            text-transform: uppercase;
            line-height: 1.2;
        }

        /* Подзаголовок "ВАНИЛЬНОГО НЕБА" */
        .subtitle {
            margin-top: 4px; /* Уменьшен отступ между строками */
            font-size: 20px; /* Размер шрифта сохранен */
            font-weight: 300;
            color: #FFEED2; /* Цвет текста */
            text-transform: uppercase;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <header>
        <h1>АДМИНСКИЕ МУТКИ</h1>
        <div class="subtitle">ВАНИЛЬНОГО НЕБА</div>
    </header>

</body>
</html>
