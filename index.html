<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    
    <meta name="theme-color" content="#604539">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFEED2;
        }

        header {
            padding: 8px 16px;
            background-color: #604539;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px; 
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .decorative-bar {
            height: 34px; 
            background-color: #604539;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center; /* Центрирование содержимого */
            padding: 0 16px; 
            box-sizing: border-box;
            border-top: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .token-input {
            background: transparent;
            border: none;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 900; /* Жирный как у H1 */
            letter-spacing: 1px;
            width: 100%;
            max-width: 200px; /* Ограничение ширины для лучшего центрирования текста */
            outline: none;
            text-transform: uppercase;
            padding: 0;
            text-align: center; /* Текст по центру */
        }

        .token-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 900; /* Копируем жирность заголовка */
            letter-spacing: 0.4px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4CAF50;
            border: 2px solid #FFFFFF;
            flex-shrink: 0;
            position: absolute; /* Точка прижата к правому краю, не мешая центрированию инпута */
            right: 16px;
        }

        .logo-container {
            width: 27px;
            height: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .text-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin: 0;
            font-size: 14.5px;
            font-weight: 900;
            color: #FFFFFF;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.4px;
        }

        .subtitle {
            margin-top: 1px;
            font-size: 14.5px;
            font-weight: 300;
            color: #FFFFFF;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.4px;
        }

        main {
            display: none;
        }

        @media (min-width: 768px) {
            h1, .subtitle { font-size: 17.5px; }
            .token-input { font-size: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Логотип" class="logo-img" onerror="this.style.display='none'">
        </div>

        <div class="text-container">
            <h1>АДМИНСКИЕ МУТКИ</h1>
            <div class="subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="decorative-bar">
        <input type="text" class="token-input" placeholder="ВХОД" spellcheck="false">
        <div class="status-dot"></div>
    </div>

</body>
</html>
