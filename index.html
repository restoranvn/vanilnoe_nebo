<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <style>
        /* Общие стили для страницы */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFEED2; /* Основной фон страницы */
        }

        /* Стили хедера */
        header {
            padding: 10px 20px;
            background-color: #604539; /* Цвет фона хедера */
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 70px;
            box-sizing: border-box;
        }

        /* Контейнер для логотипа */
        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-container img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #FFEED2;
            object-fit: cover;
            display: block;
        }

        /* Заглушка для логотипа, если файл не найден */
        .logo-placeholder {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #FFEED2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFEED2;
            background-color: #4a352c;
            font-size: 10px;
            text-align: center;
            font-weight: bold;
        }

        /* Контейнер для текста справа */
        .text-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Заголовок "АДМИНСКИЕ МУТКИ" */
        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 900;
            color: #FFEED2;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        /* Подзаголовок "ВАНИЛЬНОГО НЕБА" */
        .subtitle {
            margin-top: 1px;
            font-size: 18px;
            font-weight: 300;
            color: #FFEED2;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        /* Адаптивность для десктопов */
        @media (min-width: 768px) {
            header {
                padding: 10px 40px;
            }
            h1, .subtitle {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Исправленный путь к логотипу согласно вашему описанию -->
            <img src="ico/catering-b.ico" alt="Логотип" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="logo-placeholder" style="display: none;">LOGO</div>
        </div>

        <div class="text-container">
            <h1>АДМИНСКИЕ МУТКИ</h1>
            <div class="subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <main style="padding: 20px; text-align: center; color: #604539;">
        <!-- Сюда можно добавить основной контент сайта -->
        <p>Добро пожаловать в административную панель.</p>
    </main>

</body>
</html>
